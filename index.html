<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>川崎市バス発着ボード</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #edf1f5;
        --surface: #ffffff;
        --surface-2: #e4ebf2;
        --ink: #152430;
        --ink-2: #43566a;
        --muted: #71808f;
        --line: #d3dde6;
        --blue: #0b56a6;
        --blue-deep: #083e77;
        --blue-soft: #dfeaf7;
        --amber: #d96f00;
        --amber-ink: #b25a00;
        --red: #c62f2f;
        --board-bg: #0c1f33;
        --board-bg-2: #12304f;
        --board-ink: #ffffff;
        --board-sub: #a9c4de;
        --board-amber: #ffb020;
        --chip-bg: #ffffff;
        --shadow: 0 1px 2px rgba(16, 42, 67, .06), 0 6px 18px rgba(16, 42, 67, .07);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c141b;
          --surface: #15222e;
          --surface-2: #1c2d3d;
          --ink: #eaf2f8;
          --ink-2: #b7c8d6;
          --muted: #8ba0b2;
          --line: #2a3d4e;
          --blue: #5ea3e8;
          --blue-deep: #9cc6f2;
          --blue-soft: #17344f;
          --amber: #ffa63d;
          --amber-ink: #ffb35c;
          --red: #ff7a6b;
          --board-bg: #061523;
          --board-bg-2: #0b2742;
          --board-ink: #ffffff;
          --board-sub: #9dbfdd;
          --board-amber: #ffb020;
          --chip-bg: #15222e;
          --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.3);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        line-height: 1.5;
      }
      .num { font-family: "Barlow Semi Condensed", "Noto Sans JP", sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
      button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 0 14px 40px; }

      /* ===== sticky header zone ===== */
      .sticky {
        position: sticky; top: 0; z-index: 30;
        background: var(--bg);
        margin: 0 -14px; padding: 10px 14px 10px;
        border-bottom: 1px solid var(--line);
      }
      .statusbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
      .clock-block { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; flex: 1 1 auto; }
      .clock-block > div { min-width: 0; display: flex; gap: 12px; align-items: center; max-width: 100%; }
      .nowrap { white-space: nowrap; }
      .clock { font-size: 34px; font-weight: 700; line-height: 1; color: var(--ink); }
      .clock .sec { font-size: 19px; color: var(--muted); font-weight: 600; }
      .dateline { font-size: 13px; color: var(--ink-2); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #2ea86a; margin-right: 5px; vertical-align: 2px; animation: pulse 2s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
      .day-badge {
        flex: none; font-size: 14px; font-weight: 700; padding: 7px 14px; border-radius: 999px;
        background: var(--blue); color: #fff; letter-spacing: .06em;
      }
      .day-badge.is-sat { background: #2e7d46; }
      .day-badge.is-hol { background: #c2432e; }
      @media (prefers-color-scheme: dark) {
        .day-badge { color: #08131d; background: var(--blue); }
        .day-badge.is-sat { background: #57b877; color: #08170d; }
        .day-badge.is-hol { background: #f0836d; color: #2b0d07; }
      }

      /* stop tabs — 横スクロールは廃止し、全停留所を折り返して常時表示する。
         スワイプ自体が不要になるため、スマホでの引っかかりが原理的に起きない */
      .stop-tabs {
        display: flex; flex-wrap: wrap; gap: 7px; padding: 12px 2px 2px;
      }
      .stop-tab {
        flex: none; min-height: 44px; padding: 9px 13px; border-radius: 999px;
        border: 1.5px solid var(--line); background: var(--chip-bg); color: var(--ink-2);
        font-size: 14.5px; font-weight: 700; white-space: nowrap;
      }
      .stop-tab[aria-pressed="true"] { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
      @media (prefers-color-scheme: dark) {
        .stop-tab[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #08131d; }
      }

      /* ===== sections ===== */
      section { margin-top: 22px; }
      .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
      .sec-head h2 { margin: 0; font-size: 19px; font-weight: 900; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
      .sec-head h2 svg { flex: none; }
      .sec-meta { font-size: 12.5px; color: var(--muted); font-weight: 500; text-align: right; }

      /* pole chips */
      .pole-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; }
      .pole-chip {
        min-height: 40px; padding: 7px 14px; border-radius: 10px;
        border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
        font-size: 14px; font-weight: 700;
      }
      .pole-chip[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-deep); }
      @media (prefers-color-scheme: dark) { .pole-chip[aria-pressed="true"] { color: var(--blue); } }

      /* hero next bus (departure board) */
      .hero {
        background: linear-gradient(160deg, var(--board-bg-2), var(--board-bg) 62%);
        color: var(--board-ink); border-radius: 18px; padding: 18px 18px 16px;
        box-shadow: var(--shadow);
      }
      .hero-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .hero-label { font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--board-sub); }
      .hero-dest { font-size: 25px; font-weight: 900; line-height: 1.3; margin-top: 8px; }
      .hero-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-top: 6px; }
      .hero-time { font-size: 62px; font-weight: 700; line-height: 1; color: var(--board-amber); }
      .hero-count { text-align: right; }
      .hero-count .big { font-size: 30px; font-weight: 900; line-height: 1.15; white-space: nowrap; }
      .hero-count .big.soon { color: var(--board-amber); }
      .hero-count .sub { font-size: 13px; color: var(--board-sub); font-weight: 500; margin-top: 2px; }
      .hero-pole { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.16); font-size: 14px; color: var(--board-sub); font-weight: 500; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .hero-pole b { color: var(--board-ink); font-weight: 700; }

      /* route badge */
      .rbadge {
        display: inline-flex; align-items: center; flex: none;
        background: var(--blue); color: #fff; font-weight: 700; font-size: 13.5px;
        padding: 3px 9px; border-radius: 7px; line-height: 1.35; letter-spacing: .02em; white-space: nowrap;
      }
      .hero .rbadge { background: #fff; color: var(--board-bg); font-size: 14.5px; padding: 4px 11px; }
      .sym {
        display: inline-flex; align-items: center; justify-content: center; flex: none;
        min-width: 21px; height: 21px; padding: 0 4px; border-radius: 6px;
        background: #fdf0dc; color: #9a5b00; border: 1px solid #eec27a;
        font-size: 12.5px; font-weight: 700; line-height: 1;
      }
      @media (prefers-color-scheme: dark) { .sym { background: #3a2a10; color: #ffcf87; border-color: #7a5a22; } }

      /* departure list */
      .dep-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .dep {
        display: flex; align-items: center; gap: 12px;
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 12px 14px; min-height: 68px; box-shadow: var(--shadow);
      }
      .dep-time { font-size: 30px; font-weight: 700; line-height: 1; color: var(--ink); flex: none; min-width: 86px; }
      .dep-mid { flex: 1; min-width: 0; }
      .dep-mid .row1 { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
      .dep-dest { font-size: 16.5px; font-weight: 700; line-height: 1.35; }
      .dep-pole { font-size: 12.5px; color: var(--muted); font-weight: 500; margin-top: 2px; }
      .home-tag {
        display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px;
        background: var(--blue-soft); color: var(--blue-deep);
        font-size: 11.5px; font-weight: 700; white-space: nowrap; vertical-align: 1px;
      }
      @media (prefers-color-scheme: dark) { .home-tag { color: var(--blue); } }
      .dep-count { flex: none; text-align: right; font-weight: 900; font-size: 17px; color: var(--blue-deep); white-space: nowrap; }
      .dep-count small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; }
      .dep-count.soon { color: var(--amber-ink); }
      @media (prefers-color-scheme: dark) { .dep-count { color: var(--blue); } .dep-count.soon { color: var(--amber); } }

      .ended {
        background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius);
        padding: 20px 16px; text-align: center;
      }
      .ended .t1 { font-size: 18px; font-weight: 900; }
      .ended .t2 { font-size: 13.5px; color: var(--muted); margin-top: 4px; font-weight: 500; }
      .tomorrow-label { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 14px 2px 0; letter-spacing: .04em; }

      /* direction groups （駅へ／駅から) */
      .dir-group { margin-top: 20px; }
      .dir-group:first-child { margin-top: 4px; }
      .dir-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
      .dir-pill {
        flex: none; font-size: 16.5px; font-weight: 900; letter-spacing: .05em;
        padding: 5px 15px; border-radius: 999px;
      }
      .dir-pill.to { background: var(--blue); color: #fff; }
      .dir-pill.from { background: var(--surface); color: var(--ink); border: 1.5px solid var(--ink-2); }
      @media (prefers-color-scheme: dark) { .dir-pill.to { color: #08131d; } }
      .dir-sub { font-size: 13px; color: var(--muted); font-weight: 700; }
      .dir-empty {
        font-size: 14px; color: var(--muted); font-weight: 500; margin: 0;
        background: var(--surface); border: 1px dashed var(--line);
        border-radius: var(--radius); padding: 13px 15px;
      }
      .hero-mini .hero-dest { font-size: 22px; }
      .hero-mini .hero-time { font-size: 50px; }
      .hero-mini .hero-count .big { font-size: 25px; }
      @media (min-width: 640px) { .hero-mini .hero-time { font-size: 60px; } }

      /* ===== timetable ===== */
      .seg { display: inline-flex; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 2px; flex: none; }
      .seg button {
        border: 0; background: transparent; color: var(--ink-2); font-size: 14.5px; font-weight: 700;
        padding: 8px 15px; border-radius: 8px; min-height: 40px;
      }
      .seg button[aria-pressed="true"] { background: var(--surface); color: var(--blue-deep); box-shadow: 0 1px 4px rgba(16,42,67,.18); }
      @media (prefers-color-scheme: dark) { .seg button[aria-pressed="true"] { color: var(--blue); } }
      .tt-note { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; font-weight: 500; }
      .pole-block { margin-bottom: 18px; }
      .pole-title {
        font-size: 15px; font-weight: 900; color: var(--ink);
        display: flex; align-items: center; gap: 8px; margin: 0 0 8px;
      }
      .pole-title::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--blue); flex: none; }
      .group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; box-shadow: var(--shadow); }
      .group-btn {
        width: 100%; display: flex; align-items: center; gap: 9px; text-align: left;
        background: none; border: 0; padding: 14px; min-height: 58px; color: var(--ink);
      }
      .group-btn .dest { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; line-height: 1.4; }
      .group-btn .cnt { font-size: 12.5px; color: var(--muted); font-weight: 500; flex: none; white-space: nowrap; }
      .group-btn .chev { flex: none; transition: transform .18s ease; color: var(--muted); display: inline-flex; }
      .group.open .group-btn .chev { transform: rotate(180deg); }
      .group-body { display: none; border-top: 1px solid var(--line); padding: 6px 14px 12px; }
      .group.open .group-body { display: block; }
      table.tt { width: 100%; border-collapse: collapse; }
      table.tt th, table.tt td { padding: 7px 4px; vertical-align: top; }
      table.tt tr + tr th, table.tt tr + tr td { border-top: 1px solid var(--line); }
      table.tt th {
        width: 44px; text-align: center; font-size: 19px; font-weight: 700; color: var(--blue-deep);
        background: var(--blue-soft); border-radius: 8px; line-height: 1.3;
      }
      @media (prefers-color-scheme: dark) { table.tt th { color: var(--blue); } }
      table.tt td { padding-left: 12px; }
      .mins { display: flex; flex-wrap: wrap; gap: 5px 12px; }
      .min { font-size: 17.5px; font-weight: 600; color: var(--ink); position: relative; padding: 1px 3px; border-radius: 6px; }
      .min .msym { font-size: 11px; font-weight: 700; color: var(--amber-ink); vertical-align: super; margin-left: 1px; }
      @media (prefers-color-scheme: dark) { .min .msym { color: var(--amber); } }
      .min.next { background: var(--board-amber); color: #231600; font-weight: 700; }
      .min.next .msym { color: #7a4b00; }
      .no-service { font-size: 14px; color: var(--muted); padding: 12px 2px 6px; font-weight: 500; }

      /* legend + footer */
      .legend-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
      .legend-box h3 { margin: 0 0 8px; font-size: 14px; font-weight: 900; letter-spacing: .05em; color: var(--ink-2); }
      .legend-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
      .legend-list li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); font-weight: 500; }
      footer { margin-top: 26px; font-size: 12.5px; color: var(--muted); line-height: 1.7; font-weight: 500; }
      footer b { color: var(--ink-2); }
      .empty-note { font-size: 14.5px; color: var(--muted); font-weight: 500; padding: 16px 4px; }

      @media (min-width: 640px) {
        .hero-time { font-size: 76px; }
        .hero-dest { font-size: 29px; }
        .clock { font-size: 38px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="sticky">
        <div class="statusbar">
          <div class="clock-block">
            <div class="clock num" id="clock">--:--<span class="sec"></span></div>
            <div>
              <div class="dateline" id="dateline">読み込み中…</div>
              <div class="dateline"><span class="live-dot" aria-hidden="true"></span>30秒ごとに自動更新</div>
            </div>
          </div>
          <div class="day-badge" id="dayBadge">—</div>
        </div>
        <nav class="stop-tabs" id="stopTabs" aria-label="停留所"></nav>
      </div>

      <main>
        <section aria-labelledby="boardTitle">
          <div class="sec-head">
            <h2 id="boardTitle">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="14" rx="2.5"/><path d="M4 10h16"/><path d="M8 21l1.2-4M16 21l-1.2-4"/><circle cx="8.5" cy="13.5" r=".6" fill="currentColor"/><circle cx="15.5" cy="13.5" r=".6" fill="currentColor"/></svg>
              次のバス
            </h2>
            <div class="sec-meta" id="boardMeta"></div>
          </div>
          <div class="pole-chips" id="poleChips" aria-label="のりば絞り込み"></div>
          <div id="nextArea"></div>
        </section>

        <section aria-labelledby="ttTitle">
          <div class="sec-head">
            <h2 id="ttTitle">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
              時刻表
            </h2>
            <div class="seg" id="daySeg" role="group" aria-label="曜日区分">
              <button type="button" data-day="w">平日</button>
              <button type="button" data-day="s">土曜</button>
              <button type="button" data-day="h">休日</button>
            </div>
          </div>
          <p class="tt-note" id="ttNote"></p>
          <div id="ttBody"></div>
        </section>

        <section aria-labelledby="legendTitle">
          <div class="legend-box">
            <h3 id="legendTitle">記号の凡例</h3>
            <ul class="legend-list" id="legendList"></ul>
          </div>
        </section>
      </main>

      <footer>
        <p>出典：川崎市交通局「川崎市バスナビ」の公式標柱時刻表をもとに作成<br />
        <b>時刻表データ：2026年11月1日改正</b>（ダイヤ改正の際はデータの更新が必要です）</p>
        <p>表示時刻は時刻表上の発車予定時刻です。実際のバスは道路状況などにより遅れる場合があります。お出かけ前に公式のバスナビでもご確認ください。</p>
      </footer>
    </div>

    <script>
      /* ============================================================
         データ — 停留所を追加するときは DATA.stops に要素を足すだけ。
         構造: stops[].poles[].groups[] { r:[系統], d:行き先,
               days:{ w:平日, s:土曜, h:休日 } }

          if (tSplit.from.length) tGroups.push({ kind: "from", items: tSplit.from.slice(0, 3) });
          if (tGroups.length) {
            html += '<p class="tomorrow-label">' + label + " の始発から</p>";
            html += tGroups.map(function (g) {
              return '<div class="dir-group">' + dirHeadHTML(stop, g.kind) +
                '<ul class="dep-list" style="margin-top:0">' + g.items.map(function (d) {
                  return depRowHTML(d, -1, true);
                }).join("") + "</ul></div>";
            }).join("");
          }
          area.innerHTML = html;
          return;
        }

        var split = splitDir(stop, upcoming);
        var allSplit = splitDir(stop, all);
        var out = "";
        if (!isHub) out += dirGroupHTML(stop, "to", split.to, allSplit.to.length, nowMin);
        out += dirGroupHTML(stop, "from", split.from, allSplit.from.length, nowMin);
        area.innerHTML = out;
      }

      /* ---------- timetable ---------- */
      function renderDaySeg() {
        var seg = document.getElementById("daySeg");
        Array.prototype.forEach.call(seg.querySelectorAll("button"), function (b) {
          b.setAttribute("aria-pressed", b.getAttribute("data-day") === ttDay ? "true" : "false");
        });
      }
      function renderTimetable(now) {
        var stop = DATA.stops[stopIdx];
        var todayType = dayTypeFor(now);
        var nowMin = now.getHours() * 60 + now.getMinutes();
        document.getElementById("ttNote").textContent =
          "本日は" + DAY_LABEL[todayType] + "ダイヤです。タップで各系統の時刻表を開きます。" +
          (ttDay === todayType ? "（黄＝次のバス）" : "");
        renderDaySeg();

        var html = "";
        stop.poles.forEach(function (pole, pi) {
          html += '<div class="pole-block"><h3 class="pole-title">' + esc(stop.name) + " ・ " + esc(pole.label) + "</h3>";
          pole.groups.forEach(function (g, gi) {
            var key = stopIdx + "|" + pi + "|" + gi;
            var entries = (g.days[ttDay] || []).map(entryOf);
            var isOpen = !!openGroups[key];
            html += '<div class="group' + (isOpen ? " open" : "") + '">' +
              '<button type="button" class="group-btn" data-key="' + key + '" aria-expanded="' + (isOpen ? "true" : "false") + '">' +
              badgesHTML(g.r) + symHTML(null) +
              '<span class="dest">' + esc(g.d) + '<span class="nowrap"> 行き</span></span>' +
              '<span class="cnt">' + DAY_LABEL[ttDay] + " " + entries.length + "本</span>" +
              '<span class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>' +
              "</button>";
            html += '<div class="group-body">';
            if (entries.length === 0) {
              html += '<p class="no-service">' + DAY_LABEL[ttDay] + "の運行はありません。</p>";
            } else {
              // next departure minute for this group (only when viewing today's type)
              var nextM = -1;
              if (ttDay === todayType) {
                for (var i = 0; i < entries.length; i++) {
                  if (entries[i].m >= nowMin) { nextM = entries[i].m; break; }
                }
              }
              var byHour = {};
              entries.forEach(function (e) {
                var h = Math.floor(e.m / 60);
                (byHour[h] = byHour[h] || []).push(e);
              });
              html += '<table class="tt"><tbody>';
              Object.keys(byHour).sort(function (a, b) { return a - b; }).forEach(function (h) {
                html += "<tr><th class=\"num\">" + h + "</th><td><div class=\"mins\">" +
                  byHour[h].map(function (e) {
                    return '<span class="min num' + (e.m === nextM ? " next" : "") + '">' +
                      pad2(e.m % 60) + (e.sym ? '<span class="msym">' + esc(e.sym) + "</span>" : "") + "</span>";
                  }).join("") + "</div></td></tr>";
              });
              html += "</tbody></table>";
            }
            html += "</div></div>";
          });
          html += "</div>";
        });
        document.getElementById("ttBody").innerHTML = html;
      }

      /* ---------- legend ---------- */
      function renderLegend() {
        var used = {};
        DATA.stops.forEach(function (s) {
          s.poles.forEach(function (p) {
            p.groups.forEach(function (g) {
              ["w", "s", "h"].forEach(function (k) {
                (g.days[k] || []).forEach(function (e) {
                  if (typeof e !== "number") used[e[1]] = true;
                });
              });
            });
          });
        });
        var html = "";
        Object.keys(DATA.legend).forEach(function (sym) {
          if (!used[sym]) return;
          html += "<li>" + symHTML(sym) + "<span>" + esc(DATA.legend[sym]) + "</span></li>";
        });
        document.getElementById("legendList").innerHTML = html ||
          '<li>この停留所群に記号付きの便はありません。</li>';
      }

      /* ---------- render all / events ---------- */
      function renderAll() {
        var now = jstNow();
        if (ttDay === null) ttDay = dayTypeFor(now);
        renderHeader(now);
        renderStopTabs();
        renderPoleChips();
        renderBoard(now);
        renderTimetable(now);
      }

      document.getElementById("stopTabs").addEventListener("click", function (ev) {
        var btn = ev.target.closest(".stop-tab");
        if (!btn) return;
        stopIdx = parseInt(btn.getAttribute("data-i"), 10);
        poleFilter = "all";
        try { window.localStorage.setItem(LS_KEY, String(stopIdx)); } catch (e) {}
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      document.getElementById("poleChips").addEventListener("click", function (ev) {
        var btn = ev.target.closest(".pole-chip");
        if (!btn) return;
        poleFilter = btn.getAttribute("data-pole");
        var now = jstNow();
        renderPoleChips();
        renderBoard(now);
      });
      document.getElementById("daySeg").addEventListener("click", function (ev) {
        var btn = ev.target.closest("button[data-day]");
        if (!btn) return;
        ttDay = btn.getAttribute("data-day");
        renderTimetable(jstNow());
      });
      document.getElementById("ttBody").addEventListener("click", function (ev) {
        var btn = ev.target.closest(".group-btn");
        if (!btn) return;
        var key = btn.getAttribute("data-key");
        openGroups[key] = !openGroups[key];
        renderTimetable(jstNow());
      });

      renderLegend();
      renderAll();

      /* clock every second; board re-render when the minute rolls over,
         plus a hard 30s refresh as specified */
      setInterval(function () { renderHeader(jstNow()); }, 1000);
      setInterval(function () {
        var now = jstNow();
        var nowMin = now.getHours() * 60 + now.getMinutes();
        if (nowMin !== lastBoardMinute) {
          renderBoard(now);
          renderTimetable(now);
        }
      }, 5000);
      setInterval(function () {
        var now = jstNow();
        renderBoard(now);
        renderTimetable(now);
      }, 30000);
    </script>
  </body>
</html>
